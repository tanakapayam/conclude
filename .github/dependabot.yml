# Keeps the SHA-pinned actions in .github/workflows/ and the Node package's
# dependencies current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /node
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
